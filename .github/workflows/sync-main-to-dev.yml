name: Auto PR Main to Dev
on:
    push:
        branches:
            - main
jobs:
    create-pr:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check if commit exists on dev
              id: check-commit
              run: |
                  git fetch origin dev
                  COMMIT_SHA="${{ github.sha }}"
                  if git branch -r --contains "$COMMIT_SHA" | grep -q "origin/dev"; then
                    echo "skip=true" >> $GITHUB_OUTPUT
                    echo "Commit already exists on dev, skipping backmerge"
                  else
                    echo "skip=false" >> $GITHUB_OUTPUT
                    echo "Commit not on dev, proceeding with backmerge"
                  fi

            - name: Get latest commit message
              if: steps.check-commit.outputs.skip == 'false'
              id: commit-message
              run: |
                  MESSAGE=$(git log -1 --pretty=%B)
                  echo "message<<EOF" >> $GITHUB_OUTPUT
                  echo "$MESSAGE" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create Pull Request
              if: steps.check-commit.outputs.skip == 'false'
              id: create-pr
              uses: repo-sync/pull-request@v2
              with:
                  source_branch: main
                  destination_branch: dev
                  pr_title: '🔄 Sync main → dev'
                  pr_body: |
                      This PR automatically syncs changes from `main` back into `dev`.

                      Latest commit: ${{ steps.commit-message.outputs.message }}

                      This ensures hotfixes and direct commits to main are merged back into the development branch.

                      **Auto-generated by GitHub Actions**
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Enable Auto-merge with Rebase
              if: steps.check-commit.outputs.skip == 'false' && steps.create-pr.outputs.pr_number
              run: |
                  gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --rebase
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
